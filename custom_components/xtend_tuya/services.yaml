get_camera_stream_url:
  fields:
    device_id:
      required: true
    source:
      required: false
      example: "tuya_sharing"
      default: "tuya_sharing"
    stream_type:
      required: false
      example: "rtsp"
      default: "rtsp"

call_api:
  fields:
    source:
      required: true
      example: "tuya_sharing"
    method:
      required: true
      example: "GET"
      default: "GET"
    url:
      required: true
      example: "/v1.0/devices/{device_id}/webrtc-configs"
    payload:
      required: false

webrtc_get_ice_servers:
  fields:
    device_id:
      required: true
    session_id:
      required: true
      example: "test1"
    source:
      required: false
      example: "tuya_iot"
      default: "tuya_iot"
    format:
      required: false
      example: "SimpleWHEP"
      default: "GO2RTC"

webrtc_sdp_exchange:
  fields:
    device_id:
      required: true
    session_id:
      required: true
      example: "test1"
    source:
      required: false
      example: "tuya_iot"
      default: "tuya_iot"

webrtc_debug:
  fields:
    session_id:
      required: true
      example: "test1"
    source:
      required: false
      example: "tuya_iot"
      default: "tuya_iot"

fdm5kw_set_timer:
  fields:
    device_id:
      required: true
      example: "bfbc9ae1e1ad6d3135vxmj"
    slot:
      required: true
      example: 0
    hour:
      required: true
      example: 7
    minute:
      required: true
      example: 0
    mode:
      required: true
      example: "duration"
    value:
      required: true
      example: 1200
    days:
      required: false
      example: "[Mon, Wed, Fri]"
    enabled:
      required: false
      default: true

fdm5kw_delete_timer:
  fields:
    device_id:
      required: true
      example: "bfbc9ae1e1ad6d3135vxmj"
    slot:
      required: true
      example: 0
    hour:
      required: false
      example: 7
    minute:
      required: false
      example: 0
    days:
      required: false
      example: "[Mon, Wed, Fri]"

fdm5kw_start_watering:
  fields:
    device_id:
      required: true
      example: "bfbc9ae1e1ad6d3135vxmj"
    mode:
      required: true
      example: "duration"
    value:
      required: true
      example: 60

fdm5kw_stop_watering:
  fields:
    device_id:
      required: true
      example: "bfbc9ae1e1ad6d3135vxmj"

fdm5kw_clear_quota_lockout:
  name: Clear fdm5kw cloud-timer quota lockout
  description: >-
    Reset the circuit breaker that suppresses Tuya cloud-timer writes
    after a 60001001 "controllable device pool quota insufficient"
    error. Call after upgrading the IoT-Core plan or removing devices
    so the next timer mutation retries the cloud write. DP-only writes
    were not affected by the lockout.

fdm5kw_resync_timers:
  name: Resync fdm5kw timers from cloud
  description: >-
    Reconcile the HA timer registry for one valve against the Tuya cloud,
    dropping ghost/zombie timer slots the cloud no longer knows about.
    Disabled ghosts are dropped read-only (no quota cost); a live orphan
    slot (enabled, no cloud entry — would water offline) is cleared with a
    device write (1 controllable-device unit). Returns reconcile counts.
  fields:
    device_id:
      required: true
      example: "bfbc9ae1e1ad6d3135vxmj"